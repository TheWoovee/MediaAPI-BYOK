name: Verify Cloudflare setup
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      AUD: ${{ vars.ACCESS_AUD }}
      ZONE: thewoovee.com
      HOST: www.thewoovee.com
    steps:
      - name: Query Cloudflare and print checklist (never prints secrets)
        shell: bash
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4$1"; }
          ok()   { echo "PASS  $1"; echo "- ✅ $1" >> "$GITHUB_STEP_SUMMARY"; }
          bad()  { echo "FAIL  $1"; echo "- ❌ $1" >> "$GITHUB_STEP_SUMMARY"; FAILED=1; }
          info() { echo "INFO  $1"; echo "- ℹ️ $1" >> "$GITHUB_STEP_SUMMARY"; }
          FAILED=0
          echo "## Cloudflare setup check" >> "$GITHUB_STEP_SUMMARY"

          # 0. Secrets present
          [ -n "$CF_TOKEN" ]   && ok "GitHub secret CLOUDFLARE_API_TOKEN is set"   || bad "GitHub secret CLOUDFLARE_API_TOKEN is missing"
          [ -n "$CF_ACCOUNT" ] && ok "GitHub secret CLOUDFLARE_ACCOUNT_ID is set"  || bad "GitHub secret CLOUDFLARE_ACCOUNT_ID is missing"
          [ "$FAILED" = 1 ] && { echo "Fix the GitHub secrets first."; exit 1; }
          [ -n "$TEAM_DOMAIN" ] && ok "GitHub variable ACCESS_TEAM_DOMAIN is set ($TEAM_DOMAIN)" || info "GitHub variable ACCESS_TEAM_DOMAIN is missing (Settings → Secrets and variables → Actions → Variables tab, not Secrets)"
          [ -n "$AUD" ] && ok "GitHub variable ACCESS_AUD is set (${AUD:0:8}…)" || info "GitHub variable ACCESS_AUD is missing (Variables tab); the correct values are printed below if the token can read Access"

          # 1. Token valid
          if api /user/tokens/verify | jq -e '.success and .result.status=="active"' >/dev/null; then ok "API token is valid and active"; else bad "API token invalid or inactive"; exit 1; fi

          # 2. Account reachable
          ACC=$(api "/accounts/$CF_ACCOUNT"); if echo "$ACC" | jq -e .success >/dev/null; then ok "Account reachable: $(echo "$ACC" | jq -r .result.name)"; else bad "Account ID wrong or token lacks account access"; fi

          # 3. Zone + www record
          ZID=$(api "/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          if [ -n "$ZID" ]; then ok "Zone $ZONE is on this account (token can read zones)"; else bad "Zone $ZONE not visible to this token (needs Zone permissions for thewoovee.com)"; fi
          if [ -n "$ZID" ]; then
            REC=$(api "/zones/$ZID/dns_records?name=$HOST" | jq -r '.result[0] | "\(.type) \(.content) proxied=\(.proxied)"' 2>/dev/null)
            case "$REC" in *pages.dev*) ok "$HOST is a Cloudflare Pages custom domain ($REC)";; "null"*|"") bad "$HOST has no DNS record";; *) info "$HOST record: $REC";; esac
            WR=$(api "/zones/$ZID/workers/routes"); if echo "$WR" | jq -e .success >/dev/null; then ok "Token can manage Workers Routes on the zone ($(echo "$WR" | jq '.result|length') existing routes)"; else bad "Token lacks Zone → Workers Routes: Edit"; fi
          fi

          # 4. Workers scripts permission
          if api "/accounts/$CF_ACCOUNT/workers/scripts" | jq -e .success >/dev/null; then ok "Token can manage Workers scripts"; else bad "Token lacks Account → Workers Scripts: Edit"; fi

          # 5. D1
          D1=$(api "/accounts/$CF_ACCOUNT/d1/database?name=mediaapi-byok")
          if echo "$D1" | jq -e .success >/dev/null; then
            DID=$(echo "$D1" | jq -r '.result[] | select(.name=="mediaapi-byok") | .uuid' | head -1)
            [ -n "$DID" ] && ok "D1 database mediaapi-byok exists, id=$DID" || bad "D1 database mediaapi-byok not found (create it in Storage & Databases → D1)"
          else bad "Token lacks Account → D1: Edit"; fi

          # 6. R2
          R2=$(api "/accounts/$CF_ACCOUNT/r2/buckets")
          if echo "$R2" | jq -e .success >/dev/null; then
            echo "$R2" | jq -e '.result.buckets[]? | select(.name=="mediaapi-byok-tmp")' >/dev/null && ok "R2 bucket mediaapi-byok-tmp exists" || bad "R2 bucket mediaapi-byok-tmp not found (create it in R2 Object Storage)"
          else bad "Token lacks Account → Workers R2 Storage: Edit (or R2 not enabled)"; fi

          # 7. Workers AI
          if api "/accounts/$CF_ACCOUNT/ai/models/search?per_page=1" | jq -e .success >/dev/null; then ok "Token can call Workers AI"; else info "Token cannot read Workers AI models (only matters for the REST path; the binding works regardless)"; fi

          # 8. Access organization / team domain
          ORG=$(api "/accounts/$CF_ACCOUNT/access/organization")
          if echo "$ORG" | jq -e .success >/dev/null; then
            AD=$(echo "$ORG" | jq -r .result.auth_domain)
            if [ "https://$AD" = "$TEAM_DOMAIN" ]; then ok "Team domain matches: https://$AD"; else info "Set GitHub variable ACCESS_TEAM_DOMAIN to: https://$AD (currently '${TEAM_DOMAIN:-unset}')"; FAILED=1; fi
          else info "Token cannot read Access settings (add Account → Access: Apps and Policies: Read to let this check run); skipping Access checks"; fi

          # 9. Identity providers
          IDP=$(api "/accounts/$CF_ACCOUNT/access/identity_providers")
          if echo "$IDP" | jq -e .success >/dev/null; then
            echo "$IDP" | jq -e '.result[] | select(.type=="onetimepin")' >/dev/null && ok "One-time PIN identity provider is configured" || bad "One-time PIN identity provider missing (Zero Trust → Integrations → Identity providers)"
            echo "$IDP" | jq -e '.result[] | select(.type=="google")' >/dev/null && info "Google login is configured" || info "Google login not configured (optional)"
          fi

          # 10. Access applications
          APPS=$(api "/accounts/$CF_ACCOUNT/access/apps?per_page=100")
          if echo "$APPS" | jq -e .success >/dev/null; then
            check_app() { # $1 expected domain, $2 expected decision, $3 label
              A=$(echo "$APPS" | jq -c --arg d "$1" '.result[] | select(.domain==$d or (.self_hosted_domains//[]|index($d)))' | head -1)
              if [ -z "$A" ]; then bad "Access app for $1 not found ($3)"; return; fi
              AID=$(echo "$A" | jq -r .id); AAUD=$(echo "$A" | jq -r .aud)
              P=$(api "/accounts/$CF_ACCOUNT/access/apps/$AID/policies")
              DEC=$(echo "$P" | jq -r '[.result[].decision] | join(",")')
              case ",$DEC," in *",$2,"*) ok "Access app $3 ($1): policy $2 present";; *) bad "Access app $3 ($1): expected a policy with decision '$2', found '${DEC:-none}'";; esac
              if [ "$3" = "Studio" ]; then
                if [ "$AAUD" = "$AUD" ]; then ok "ACCESS_AUD matches the Studio app AUD"; else info "Set GitHub variable ACCESS_AUD to: $AAUD (currently '${AUD:-unset}')"; FAILED=1; fi
                EM=$(echo "$P" | jq -r '[.result[] | select(.decision=="allow") | .include[]? | .email?.email // empty] | join(",")')
                [ -n "$EM" ] && info "Studio allow-list emails: $EM" || info "Studio allow policy has no email include (check the policy Include rule)"
              fi
            }
            check_app "$HOST/studio" allow Studio
            check_app "$HOST/studio/api/health" bypass "Studio health"
            check_app "$HOST/studio/api/tmp" bypass "Studio temp files"
          fi

          echo; if [ "$FAILED" = 1 ]; then echo "Some checks failed. See summary."; exit 1; else echo "All checks passed."; fi
